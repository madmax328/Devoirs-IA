name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://localhost:27017/devoirs_test?directConnection=true
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: MongoDB (replica set, comme Atlas)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1}).ok" && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @devoirs/web build

      - name: Tests E2E (Playwright)
        run: |
          pnpm --filter @devoirs/web exec playwright install --with-deps chromium
          pnpm --filter @devoirs/web e2e
      - name: Diagnostic des tests E2E en échec
        if: failure()
        run: |
          find apps/web/test-results -name error-context.md -print -exec sed -n '/Page snapshot/,/Test source/p' {} \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

      - name: Bundle mobile (iOS)
        run: pnpm --filter @devoirs/mobile exec expo export --platform ios --output-dir /tmp/expo-ios
        env:
          CI: "1"
